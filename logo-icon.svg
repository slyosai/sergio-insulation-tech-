<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="100%" height="100%" fill="none">
  <defs>
    <!-- Deep Industrial Blue Gradient -->
    <linearGradient id="badgeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#152843"/>
      <stop offset="60%" stop-color="#0a1628"/>
      <stop offset="100%" stop-color="#050d18"/>
    </linearGradient>

    <!-- Metallic Aluminum Rim -->
    <linearGradient id="badgeMetalRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#94a3b8"/>
      <stop offset="70%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>

    <!-- Thermal Heat Orange Gradient -->
    <linearGradient id="hotFlame" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff8c26"/>
      <stop offset="50%" stop-color="#e05326"/>
      <stop offset="100%" stop-color="#b83204"/>
    </linearGradient>

    <!-- Cryogenic Chilled Water Cyan Gradient -->
    <linearGradient id="cryoCold" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#00d4ff"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>

    <!-- Shield Shadow -->
    <filter id="badgeShadow" x="-20%" y="-15%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.55"/>
    </filter>

    <!-- Heat Glow -->
    <filter id="heatGlow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.8" flood-color="#e05326" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Hexagonal Industrial Shield Base -->
  <polygon points="24,2.5 44,13.5 44,34.5 24,45.5 4,34.5 4,13.5" 
           fill="url(#badgeBg)" 
           stroke="url(#badgeMetalRim)" 
           stroke-width="2" 
           stroke-linejoin="round" 
           filter="url(#badgeShadow)"/>

  <!-- Inset Title 24 Precision Dashed Line -->
  <polygon points="24,5.5 41,15 41,33 24,42.5 7,33 7,15" 
           fill="none" 
           stroke="#e05326" 
           stroke-width="0.8" 
           stroke-dasharray="2.5 1.5" 
           opacity="0.6"/>

  <!-- Upper Cold Piping Flow (Cyan, Chilled Water) -->
  <path d="M 14,18 C 14,12 34,12 34,20 C 34,23.5 30,25 24,25" 
        stroke="url(#cryoCold)" 
        stroke-width="3.2" 
        stroke-linecap="round"/>

  <!-- Aluminum Pipe Jacket Joint Clamp -->
  <rect x="22" y="10.5" width="4" height="5" rx="1" fill="url(#badgeMetalRim)" stroke="#091322" stroke-width="0.5"/>

  <!-- Lower Hot Steam Pipe Flow (Thermal Orange 'S' curve) -->
  <path d="M 24,25 C 18,25 14,26.5 14,30 C 14,38 34,38 34,30" 
        stroke="url(#hotFlame)" 
        stroke-width="3.2" 
        stroke-linecap="round" 
        filter="url(#heatGlow)"/>

  <!-- Interlocking Insulated Foundation 'L' (Crisp Bright White) -->
  <path d="M 18.5,21.5 L 18.5,35 L 30.5,35" 
        stroke="#ffffff" 
        stroke-width="2.6" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>

  <!-- Industrial Fitting Rivets / Fasteners -->
  <circle cx="18.5" cy="35" r="1.4" fill="#e05326"/>
  <circle cx="30.5" cy="35" r="1.4" fill="#00d4ff"/>
</svg>

